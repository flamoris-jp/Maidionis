name: Core CI
on:
  push:
    branches: [main, feat/core-m1-m5]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-acceptance:
    name: Linux CPU acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU build dependencies
        run: |
          python -m pip install -r tools/dependencies.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Native, Python, and full Tiny Beat acceptance
        run: python tools/verify.py
      - name: Regenerated schemas remain identical
        run: |
          python contracts/generate.py
          git diff --exit-code -- contracts
      - name: Numerical dependency is optional
        run: python tools/verify.py --no-numerical --build-dir build-contracts
